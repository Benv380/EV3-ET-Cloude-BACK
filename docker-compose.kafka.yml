# =====================================================================================
#  Apache Kafka: ensamble de 3 ZooKeeper + clúster de 3 brokers (STREAMING de eventos)
#
#  Solo Kafka:         docker compose -f docker-compose.kafka.yml up -d
#  Ver los brokers:    docker compose exec kafka1 kafka-broker-api-versions --bootstrap-server kafka1:29092 | grep id
#  Ver un topic:       docker compose exec kafka1 kafka-topics --bootstrap-server kafka1:29092 --describe --topic pedidos.eventos
#
#  Por qué 3 + 3:
#   - ZooKeeper guarda los metadatos del clúster (brokers vivos, líder de cada partición, configs).
#     Funciona por MAYORÍA (quórum): con 3 nodos sigue operando si cae 1 (2 de 3 = mayoría).
#   - 3 brokers permiten replication.factor=3: cada partición tiene una copia en cada broker.
#     Con min.insync.replicas=2 y acks=all, si cae 1 broker se sigue leyendo y escribiendo sin perder datos.
#
#  Puertos: 9092/9093/9094 solo en 127.0.0.1 (para correr microservicios desde el IDE). En la nube NO se exponen:
#  los microservicios usan la red interna de Docker (kafkaN:29092).
#  Imágenes Confluent 7.7 (Kafka 3.7): última línea que soporta ZooKeeper (Kafka 4 solo usa KRaft).
# =====================================================================================
name: pedidos360

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.7.1
  restart: unless-stopped
  healthcheck:
    # "srvr" responde "Mode: leader" o "Mode: follower" solo cuando el nodo forma parte del quórum.
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/2181 && echo srvr >&3 && grep -qE \"Mode: (leader|follower)\" <&3'"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # puerto 2888: replicación entre nodos · puerto 3888: elección de líder
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat,mntr
  KAFKA_HEAP_OPTS: -Xms64m -Xmx128m

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.7.1
  restart: unless-stopped
  depends_on:
    zookeeper1:
      condition: service_healthy
    zookeeper2:
      condition: service_healthy
    zookeeper3:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/29092'"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  # INTERNO: tráfico entre brokers y desde los contenedores · EXTERNO: desde el host (IDE)
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
  # ---- Durabilidad y tolerancia a fallos ----
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3        # __consumer_offsets: offsets de los consumer groups
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"     # nunca elegir como líder una réplica desactualizada
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"          # los topics se crean explícitamente (con su configuración)
  # ---- Retención por defecto del broker (cada topic la sobrescribe) ----
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
  KAFKA_LOG_CLEANER_ENABLE: "true"                 # necesario para los topics compactados
  # ---- Consumer groups ----
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 1000
  # ---- Recursos y métricas (Kafka UI lee las métricas por JMX) ----
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
  KAFKA_JMX_PORT: 9997

services:
  # ----------------------------- ZooKeeper (quórum de 3) -----------------------------
  zookeeper1:
    <<: *zookeeper
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1-data:/var/lib/zookeeper/data
      - zookeeper1-log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zookeeper
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2-data:/var/lib/zookeeper/data
      - zookeeper2-log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3-data:/var/lib/zookeeper/data
      - zookeeper3-log:/var/lib/zookeeper/log

  # ----------------------------- Brokers Kafka (3) -----------------------------
  kafka1:
    <<: *kafka
    hostname: kafka1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka1:29092,EXTERNO://localhost:9092
      KAFKA_JMX_HOSTNAME: kafka1
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    hostname: kafka2
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka2:29092,EXTERNO://localhost:9093
      KAFKA_JMX_HOSTNAME: kafka2
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    hostname: kafka3
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka3:29092,EXTERNO://localhost:9094
      KAFKA_JMX_HOSTNAME: kafka3
    volumes:
      - kafka3-data:/var/lib/kafka/data

volumes:
  zookeeper1-data:
  zookeeper1-log:
  zookeeper2-data:
  zookeeper2-log:
  zookeeper3-data:
  zookeeper3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
