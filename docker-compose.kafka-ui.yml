# =====================================================================================
#  Kafka UI: consola web del clúster Kafka
#
#  Solo Kafka UI (requiere el clúster de docker-compose.kafka.yml):
#      docker compose -f docker-compose.kafka.yml -f docker-compose.kafka-ui.yml up -d
#  Abrir: http://localhost:8090   (usuario y clave: KAFKA_UI_USER / KAFKA_UI_PASSWORD del .env)
#
#  Qué se ve: brokers y controlador, topics (particiones, réplicas, ISR, configs), mensajes con su
#  clave, headers de negocio y partición/offset, consumer groups con su lag por partición y métricas JMX.
#
#  Reglas de negocio aplicadas en la UI:
#   - Enmascaramiento: el campo "usuario" (quién hizo la operación) se muestra enmascarado en los topics
#     pedidos.* (dato personal; la analítica no lo necesita).
#   - Los mensajes se pueden publicar desde la UI (Produce Message) con las plantillas de negocio
#     de GET /api/admin/kafka/plantillas: el sistema reacciona en tiempo real (métricas, alertas, DLT).
# =====================================================================================
name: pedidos360

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_METRICS_TYPE: JMX
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      KAFKA_CLUSTERS_0_MASKING_0_TYPE: MASK
      KAFKA_CLUSTERS_0_MASKING_0_FIELDS_0: usuario
      KAFKA_CLUSTERS_0_MASKING_0_TOPICVALUESPATTERN: "pedidos\\..*"
      DYNAMIC_CONFIG_ENABLED: "false"
      # Acceso con usuario y clave (la consola permite crear/borrar topics y publicar mensajes).
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-pedidos123}
      JAVA_OPTS: -Xms96m -Xmx256m
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    restart: unless-stopped
