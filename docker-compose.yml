# =====================================================================================
#  Pedidos 360 - backend completo (EV3: RabbitMQ + Kafka)
#
#  Levantar todo:            docker compose up -d --build
#  Ver estado:               docker compose ps
#
#  El sistema se arma con 3 archivos más (cada uno se puede levantar por separado):
#    docker-compose.rabbitmq.yml   clúster RabbitMQ de 2 nodos
#    docker-compose.kafka.yml      3 ZooKeeper + 3 brokers Kafka
#    docker-compose.kafka-ui.yml   consola Kafka UI
#
#  Puertos publicados:
#    8080  gateway nginx -> microservicios (backend que consumen Azure API Management y AWS API Gateway)
#    8090  Kafka UI
#    15672 / 15673 consola RabbitMQ nodo 1 / nodo 2
#    5672 / 5673 AMQP · 9092-9094 Kafka (solo 127.0.0.1, para el IDE)
# =====================================================================================
name: pedidos360

include:
  - docker-compose.rabbitmq.yml
  - path:
      - docker-compose.kafka.yml
      - docker-compose.kafka-ui.yml

x-app: &app
  restart: unless-stopped
  environment: &app-env
    RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
    RABBITMQ_USER: ${RABBITMQ_USER:-pedidos}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos123}
    KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/pedidos}
    DB_USER: ${DB_USER:-pedidos}
    DB_PASSWORD: ${DB_PASSWORD:-pedidos123}
    SEGURIDAD_HABILITADA: ${SEGURIDAD_HABILITADA:-true}
    ENTRA_ISSUER: ${ENTRA_ISSUER:-}
    ENTRA_JWK_SET_URI: ${ENTRA_JWK_SET_URI:-}
    ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
    COGNITO_ISSUER: ${COGNITO_ISSUER:-}
    COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI:-}
    COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ROL_ADMIN: ${ROL_ADMIN:-}
    CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4200}
    # Memoria acotada: 6 microservicios + Kafka + RabbitMQ deben caber en una VM de 8 GB.
    JAVA_OPTS: -Xms64m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -Xss512k

x-depende-rabbit: &depende-rabbit
  rabbitmq1:
    condition: service_healthy
  rabbitmq2:
    condition: service_healthy
  postgres:
    condition: service_healthy

x-depende-kafka: &depende-kafka
  kafka1:
    condition: service_healthy
  kafka2:
    condition: service_healthy
  kafka3:
    condition: service_healthy
  postgres:
    condition: service_healthy

services:
  # ----------------------------- Base de datos local -----------------------------
  # En la nube se usa Azure Database for PostgreSQL (DB_URL en el .env) y este contenedor no se usa.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: ${DB_USER:-pedidos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pedidos123}
    # Sin puerto publicado: solo la usan los microservicios por la red interna de Docker.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ----------------------------- Microservicios -----------------------------
  pedidos-service:          # productor RabbitMQ + productor Kafka
    <<: *app
    build: { context: ., args: { MODULE: pedidos-service } }
    depends_on:
      <<: [*depende-rabbit, *depende-kafka]

  notificaciones-service:   # consumidor RabbitMQ (notificaciones + auditoría)
    <<: *app
    build: { context: ., args: { MODULE: notificaciones-service } }
    depends_on: *depende-rabbit

  documentos-service:       # consumidor RabbitMQ (tickets y boletas)
    <<: *app
    build: { context: ., args: { MODULE: documentos-service } }
    depends_on: *depende-rabbit

  rabbit-admin-service:     # administración de RabbitMQ
    <<: *app
    build: { context: ., args: { MODULE: rabbit-admin-service } }
    environment:
      <<: *app-env
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq1:15672
    depends_on: *depende-rabbit

  analitica-service:        # consumidor Kafka (analítica, alertas, vista de estados, monitor DLT)
    <<: *app
    build: { context: ., args: { MODULE: analitica-service } }
    depends_on: *depende-kafka

  kafka-admin-service:      # administración de Kafka (topics, configs, consumer groups, lag)
    <<: *app
    build: { context: ., args: { MODULE: kafka-admin-service } }
    depends_on: *depende-kafka

  # ----------------------------- Gateway (entrada única) -----------------------------
  gateway:
    image: nginx:1.27-alpine
    ports:
      # En la nube: GATEWAY_PORT=80 (puerto abierto en el firewall de la VM)
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pedidos-service
      - notificaciones-service
      - documentos-service
      - rabbit-admin-service
      - analitica-service
      - kafka-admin-service
    restart: unless-stopped

volumes:
  postgres-data:
